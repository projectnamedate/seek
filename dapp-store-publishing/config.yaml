# Solana dApp Store publishing config for Seek.
#
# Used by `@solana-mobile/dapp-store-cli` to mint the Publisher NFT (once),
# the App NFT (once per app), and Release NFTs (one per version).
#
# Docs: https://docs.solanamobile.com/dapp-publishing/intro
# CLI:  https://github.com/solana-mobile/dapp-publishing
#
# Pipeline:
#   npx dapp-store init                           # scaffolds this file
#   npx dapp-store create publisher -k ../.secrets/dapp-store/publisher.json
#   npx dapp-store create app -k ../.secrets/dapp-store/publisher.json
#   npx dapp-store create release -k ../.secrets/dapp-store/publisher.json
#   npx dapp-store publish submit \
#       -k ../.secrets/dapp-store/publisher.json \
#       --requestor-is-authorized \
#       --complies-with-solana-dapp-store-policies
#
# Placeholders below — fill in before first real mint.

publisher:
  # Your publisher identity (NFT owner). This keypair must stay funded with
  # ~0.5 SOL. BACK IT UP — losing it means losing control of the listing.
  #
  # Generated 2026-05-05 at `.secrets/dapp-store/publisher.json`; back it up
  # before first submission. Losing the private key = losing the ability to
  # publish updates forever.
  address: Dzbqbjh8qowVK7x89vj1vo1ApUz7LNRqmR39yYXehenR
  name: Projectnamedate LLC
  website: https://seek.mythx.art
  email: jeff@projectname.date

app:
  # Android package name — must match mobile/app.json android.package
  android_package: app.seek.mobile
  name: Seek
  urls:
    license_url: https://seek.mythx.art/license
    copyright_url: https://seek.mythx.art/license
    privacy_policy_url: https://seek.mythx.art/privacy
    website: https://seek.mythx.art

release:
  # Prepared v1.0.5 update config. Keep this aligned with the APK candidate
  # and portal-backed review submission.
  address: AUTO_GENERATED_AT_CREATE_TIME
  media:
    - purpose: icon
      uri: assets/icon.png
    - purpose: banner
      uri: assets/banner.png
    - purpose: screenshot
      uri: assets/screenshots/en-US/01-home.png
    - purpose: screenshot
      uri: assets/screenshots/en-US/04-mission.png
    - purpose: screenshot
      uri: assets/screenshots/en-US/05-validation.png
    - purpose: screenshot
      uri: assets/screenshots/en-US/06-results.png
  files:
    - purpose: install
      uri: ../mobile/android/app/build/outputs/apk/release/app-release.apk
  catalog:
    en-US:
      name: Seek
      short_description: Real-world scavenger hunts on Seeker with on-chain SKR rewards.
      long_description: |
        Seek turns your Seeker phone into a real-world scavenger-hunt device.

        HOW IT WORKS
        1. Connect your Solana wallet with MWA (no browser, no extension).
        2. Pick a tier: Easy (500 $SKR / 3 min), Medium (1000 $SKR / 2 min), or Hard (2000 $SKR / 1 min).
        3. Pay your entry and receive a randomly-assigned target.
        4. Race the clock. Find it in the real world. Photograph it.
        5. AI (Claude Vision) verifies.
        6. Complete the mission = claim your return. Miss the mission = entry fuels the ecosystem.

        SKILL-BASED, ON-CHAIN, PHONE-NATIVE
        All bounties are on-chain transactions on Solana. Commit-reveal mission
        assignment, AI + EXIF cross-check, Seeker Genesis Token verification.

        ECONOMICS
        Complete: keep your entry + earn 1x more from the reward pool.
        Singularity pool: eligible completions can receive an additional bonus.
        Missed mission: 70% reward pool / 20% Singularity pool / 10% treasury.

        BUILT FOR SEEKER
        Native MWA, .SKR name resolution, camera attestation. Can only exist
        on Seeker.

        18+ only. Skill-based competition. Not available where skill-based
        contests with cash prizes are restricted.
      # Candidate v1.0.5 copy. Show this exact text to the user before upload.
      # Do not mention payout math or 2x total return in store changelogs.
      new_in_version: Adds secure bounty sessions and strengthens Seeker Genesis Token verification for paid hunts.
      saga_features_localized: Native Mobile Wallet Adapter, .SKR name resolution, Seeker Genesis Token bonus, camera attestation.

solana_mobile_dapp_publisher_portal:
  google_store_package: ""  # empty — we're dApp-Store-only, not also on Play Store
  testing_instructions: |
    Test wallet seed with enough mainnet SKR for at least one Easy-tier hunt
    plus 0.05 SOL for tx fees is provided in the submission notes. This is
    real on-chain SKR; the app does NOT support a dev/test mode.
    To run a complete flow:
    1. Launch the app (age gate on first run — accept 18+)
    2. Tap Connect Wallet → approve the Mobile Wallet Adapter prompt in Seeker Wallet
    3. Seeker Genesis Token verification runs passively when the connected wallet holds one
    4. Pick Easy tier (500 SKR) → Start Hunt → approve the accept_bounty_v2 tx
    5. Accept the random mission (commit-revealed by backend)
    6. Tap camera → capture any photo matching the mission target
    7. AI (Claude Vision) validates in ~3 seconds
    8. On Easy win: the completion return pays out from the house pool after
       finalization. On missed mission: entry distributed 70/20/10 across
       reward, Singularity, and treasury pools. Public disputes are disabled in
       this release, so there is no extra challenge/deposit transaction.

    Source: github.com/projectnamedate/seek. Questions: jeff@projectname.date.

# Age / content ratings (per dApp Store policy)
iarc_rating_system:
  age_rating: EIGHTEEN_PLUS
  reasons:
    - SIMULATED_GAMBLING        # paid-entry skill contest rating flag
    - USER_GENERATED_CONTENT    # photos uploaded for validation

# Required attestations (submit flow). Keep these as-is — the CLI injects
# them via --requestor-is-authorized --complies-with-solana-dapp-store-policies
# flags at publish time.
