  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#bottomLift)"/>
  <rect width="1200" height="600" fill="url(#rightAura)"/>
  <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 560h1200M300 0v600M600 0v600M900 0v600" stroke="#cfe6e4" stroke-width="2" opacity="0.026"/>
  <path d="M640 -20L782 18L632 600L488 580Z" fill="url(#searchBeam)"/>
  <g transform="translate(-146 326) scale(0.9)" fill="none" stroke-linecap="round" opacity="0.13">
    <circle cx="256" cy="256" r="222" stroke="#95d2e6" stroke-width="5"/>
