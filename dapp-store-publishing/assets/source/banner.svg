    <rect x="794" y="16" width="362" height="662" rx="52" fill="#10282c" stroke="#61afbd" stroke-width="2.5" opacity="0.98"/>
    <image href="../screenshots/en-US/01-home.png" x="812" y="46" width="322" height="716" preserveAspectRatio="xMidYMin meet" clip-path="url(#screenClip)"/>
    <rect x="812" y="46" width="322" height="614" rx="34" fill="none" stroke="#cfe6e4" stroke-width="1.5" opacity="0.44"/>
  </g>
