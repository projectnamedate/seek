  <use href="#seekIrisTrace" x="104" y="88" width="126" height="126"/>
  <text x="256" y="192" fill="url(#accent)" font-family="Avenir Next, Arial" font-size="124" font-weight="500" letter-spacing="-1">Seek</text>
  <text x="104" y="306" fill="#f6f6f5" font-family="Avenir Next, Arial" font-size="50" font-weight="500" letter-spacing="0">Hunt. Capture. Win.</text>
  <rect x="104" y="340" width="600" height="2" rx="1" fill="url(#cyanLine)" opacity="0.82"/>
  <g filter="url(#screenShadow)">
