<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Seek dApp Store banner with app home screenshot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#010101"/>
      <stop offset="0.42" stop-color="#061c22"/>
      <stop offset="0.7" stop-color="#092b34"/>
      <stop offset="1" stop-color="#12383d"/>
    </linearGradient>
    <radialGradient id="bottomLift" cx="12%" cy="108%" r="64%">
      <stop offset="0" stop-color="#61afbd" stop-opacity="0.34"/>
      <stop offset="0.4" stop-color="#10282c" stop-opacity="0.58"/>
      <stop offset="1" stop-color="#010101" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightAura" cx="83%" cy="45%" r="50%">
      <stop offset="0" stop-color="#61afbd" stop-opacity="0.24"/>
      <stop offset="0.48" stop-color="#10282c" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#010101" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="68" y1="70" x2="690" y2="494" gradientUnits="userSpaceOnUse">
