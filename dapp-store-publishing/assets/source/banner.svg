      <stop offset="0.62" stop-color="#95d2e6"/>
      <stop offset="1" stop-color="#61afbd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="searchBeam" x1="430" y1="60" x2="860" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#95d2e6" stop-opacity="0.1"/>
      <stop offset="0.58" stop-color="#61afbd" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#010101" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="seekLensDepth" cx="50%" cy="48%" r="68%">
      <stop offset="0" stop-color="#101618"/>
      <stop offset="0.55" stop-color="#071314"/>
      <stop offset="1" stop-color="#010101"/>
    </radialGradient>
    <filter id="screenShadow" x="-40%" y="-20%" width="180%" height="140%">
      <feDropShadow dx="-18" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#61afbd" flood-opacity="0.22"/>
    </filter>
    <clipPath id="screenClip">
