    <path id="seekTraceSeparator" d="M256 56C334 67 398 126 416 202C399 249 361 282 314 298"/>
    <path id="seekTraceOpening" d="M314 214L326 277L270 326L207 303L188 239L242 184Z"/>
    <symbol id="seekIrisTrace" viewBox="0 0 512 512">
      <circle cx="256" cy="256" r="236" fill="#010101"/>
      <circle cx="256" cy="256" r="220" fill="#10282c"/>
      <circle cx="256" cy="256" r="209" fill="url(#seekLensDepth)" stroke="#95d2e6" stroke-width="10"/>
      <circle cx="256" cy="256" r="195" fill="none" stroke="#010101" stroke-width="10"/>
      <g clip-path="url(#seekTraceClip)" fill="none" stroke-linecap="round">
        <use href="#seekTraceSeparator" stroke="#cfe6e4" stroke-width="7" opacity="0.95" transform="rotate(0 256 256)"/>
        <use href="#seekTraceSeparator" stroke="#95d2e6" stroke-width="7" opacity="0.9" transform="rotate(60 256 256)"/>
        <use href="#seekTraceSeparator" stroke="#61afbd" stroke-width="7" opacity="0.85" transform="rotate(120 256 256)"/>
        <use href="#seekTraceSeparator" stroke="#cfe6e4" stroke-width="7" opacity="0.95" transform="rotate(180 256 256)"/>
        <use href="#seekTraceSeparator" stroke="#95d2e6" stroke-width="7" opacity="0.9" transform="rotate(240 256 256)"/>
        <use href="#seekTraceSeparator" stroke="#61afbd" stroke-width="7" opacity="0.85" transform="rotate(300 256 256)"/>
      </g>
      <use href="#seekTraceOpening" fill="#f6f6f5"/>
