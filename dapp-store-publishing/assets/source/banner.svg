    <use href="#seekTraceSeparator" stroke="#cfe6e4" stroke-width="8" opacity="0.9" transform="rotate(0 256 256)"/>
    <use href="#seekTraceSeparator" stroke="#95d2e6" stroke-width="8" opacity="0.82" transform="rotate(60 256 256)"/>
    <use href="#seekTraceSeparator" stroke="#61afbd" stroke-width="8" opacity="0.78" transform="rotate(120 256 256)"/>
    <use href="#seekTraceSeparator" stroke="#cfe6e4" stroke-width="8" opacity="0.9" transform="rotate(180 256 256)"/>
    <use href="#seekTraceSeparator" stroke="#95d2e6" stroke-width="8" opacity="0.82" transform="rotate(240 256 256)"/>
    <use href="#seekTraceSeparator" stroke="#61afbd" stroke-width="8" opacity="0.78" transform="rotate(300 256 256)"/>
    <use href="#seekTraceOpening" stroke="#f6f6f5" stroke-width="9" stroke-linejoin="round" opacity="0.9"/>
